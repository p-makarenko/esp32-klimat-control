<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Голосовий ввід для Antigravity (Chrome AI Speech)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: #334155;
      color: #94a3b8;
      transition: all 0.3s;
    }
    .status-badge.listening {
      background: #065f46;
      color: #34d399;
      box-shadow: 0 0 10px #10b98188;
    }
    .status-badge.copied {
      background: #1e3a8a;
      color: #60a5fa;
    }
    .mic-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 0;
    }
    .mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 2.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .mic-btn:hover {
      transform: scale(1.05);
      background: #2563eb;
    }
    .mic-btn.active {
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .mic-tip {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .text-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 1.05rem;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #f1f5f9;
      outline: none;
    }
    .text-box:focus {
      border-color: #38bdf8;
    }
    .interim {
      color: #64748b;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #e2e8f0;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #475569;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
    }
    .toast {
      text-align: center;
      font-size: 0.85rem;
      color: #10b981;
      min-height: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">
        <span>🎙️</span> Голосовий ввід (Google Chrome AI)
      </div>
      <div id="status" class="status-badge">Готовий</div>
    </div>

    <div class="mic-section">
      <button id="micBtn" class="mic-btn" title="Натисніть або натисніть ПРОБІЛ для запису">🎤</button>
      <div class="mic-tip">Натисніть кнопку або <b>Пробіл</b> для старту / зупинки</div>
      <div id="toast" class="toast"></div>
    </div>

    <div id="textBox" class="text-box" contenteditable="true" placeholder="Тут з'явиться ваш текст..."></div>

    <div class="actions">
      <label class="toggle-wrap">
        <input type="checkbox" id="autoCopy" checked>
        Автоматично копіювати в буфер (Ctrl+V)
      </label>
      <div style="display: flex; gap: 8px;">
        <button id="clearBtn" class="btn">Очистити</button>
        <button id="copyBtn" class="btn btn-primary">Скопіювати</button>
      </div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const statusEl = document.getElementById('status');
    const textBox = document.getElementById('textBox');
    const toast = document.getElementById('toast');
    const autoCopy = document.getElementById('autoCopy');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    let recognition = null;
    let isListening = false;
    let finalTranscript = '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusEl.textContent = 'Speech API не підтримується';
      statusEl.style.background = '#7f1d1d';
      alert('Будь ласка, відкрийте цю сторінку саме у Google Chrome!');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'uk-UA';
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        statusEl.textContent = 'Слухаю... Говоріть';
        statusEl.className = 'status-badge listening';
        showToast('');
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += (finalTranscript ? ' ' : '') + transcript.trim();
            if (autoCopy.checked) {
              copyToClipboard(finalTranscript, false);
            }
          } else {
            interimTranscript += transcript;
          }
        }
        textBox.innerHTML = finalTranscript + (interimTranscript ? `<span class="interim"> ${interimTranscript}</span>` : '');
        textBox.scrollTop = textBox.scrollHeight;
      };

      recognition.onerror = (event) => {
        console.error('Speech error:', event.error);
        if (event.error === 'no-speech') {
          showToast('Не почуто мови. Говоріть ближче до мікрофона');
        } else {
          showToast('Помилка: ' + event.error);
        }
      };

      recognition.onend = () => {
        if (isListening) {
          // Автоперезапуск якщо випадково обірвалося, щоб не зупинялося само
          try { recognition.start(); } catch(e) {}
        } else {
          micBtn.classList.remove('active');
          statusEl.textContent = 'Зупинено';
          statusEl.className = 'status-badge';
          if (finalTranscript && autoCopy.checked) {
            copyToClipboard(finalTranscript, true);
          }
        }
      };
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        isListening = false;
        recognition.stop();
        if (finalTranscript && autoCopy.checked) {
          copyToClipboard(finalTranscript, true);
        }
      } else {
        finalTranscript = textBox.innerText.trim();
        recognition.start();
      }
    }

    function copyToClipboard(text, notify = true) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        if (notify) {
          showToast('✓ Текст скопійовано! Натисніть Ctrl+V у чаті');
          statusEl.textContent = 'Скопійовано!';
          statusEl.className = 'status-badge copied';
        }
      }).catch(err => {
        console.error('Clipboard error:', err);
      });
    }

    function showToast(msg) {
      toast.textContent = msg;
    }

    micBtn.addEventListener('click', toggleListening);
    clearBtn.addEventListener('click', () => {
      finalTranscript = '';
      textBox.innerHTML = '';
      showToast('');
    });
    copyBtn.addEventListener('click', () => {
      copyToClipboard(textBox.innerText.trim(), true);
    });

    // Гаряча клавіша: Пробіл для ввімкнення/вимкнення (якщо фокус не в полі редагування)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== textBox) {
        e.preventDefault();
        toggleListening();
      }
    });

    // Автостарт при завантаженні для максимальної зручності
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        toggleListening();
      }, 500);
    });
  </script>
</body>
</html>
