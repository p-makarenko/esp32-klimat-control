[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = partitions_ota.csv  ; Custom OTA partition table: 2x1.5MB app + 768KB SPIFFS
upload_port = COM5
monitor_speed = 115200
monitor_encoding = utf-8
monitor_filters = esp32_exception_decoder, log2file
monitor_echo = yes
extra_scripts = pre:count_lines.py
build_type = debug
build_flags =
    -DCONFIG_ESP_COREDUMP_ENABLE_TO_NONE=1
    -DCORE_DEBUG_LEVEL=0
    -g
    -ggdb
    -Og
    -DENABLE_ENERGY_MONITOR=1

lib_deps =
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit BME280 Library
