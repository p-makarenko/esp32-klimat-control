[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.partitions = partitions_ota.csv  ; Схему пам'яті залишаємо без змін

upload_port = COM5
monitor_speed = 115200
monitor_encoding = utf-8
monitor_filters = esp32_exception_decoder, log2file
monitor_echo = yes
extra_scripts = pre:count_lines.py

build_type = release
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -Os
    -DENABLE_ENERGY_MONITOR=1

lib_deps =
    bblanchon/ArduinoJson
    madhephaestus/ESP32Servo
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit BME280 Library
    mandulaj/PZEM-004T-v30
    https://github.com/Sensirion/arduino-i2c-scd30.git